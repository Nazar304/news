# Relative base works on any host (pages.dev, custom domain, localhost).
# Set HUGO_BASEURL=https://your-domain/ in CI once the domain is final (absolute canonical/OG URLs).
baseURL = "/"
locale = "uk"
defaultContentLanguage = "uk"
title = "ZEITPUNKT"
enableRobotsTXT = true

[params]
  description = "Міжнародний типографічний огляд незалежної думки, культури та політичної економії."
  city = "KYIV"
  issue = "402"
  edition = "EDITION: DIGITAL / UKRAINE"
  founded = "2024"

[pagination]
  pagerSize = 8

[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"

[permalinks.page]
  articles = "/articles/:contentbasename/"

[markup.goldmark.parser.attribute]
  block = true
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 80

# The sections row under the masthead is generated from content/categories (ordered by weight).
[menus]
  [[menus.main]]
    name = "Головне"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Архів"
    pageRef = "/articles"
    weight = 20
  [[menus.main]]
    name = "Автори"
    pageRef = "/authors"
    weight = 30

  [[menus.institution]]
    name = "Коло авторів"
    pageRef = "/authors"
    weight = 10
  [[menus.institution]]
    name = "Рубрики"
    pageRef = "/categories"
    weight = 20
  [[menus.institution]]
    name = "Теги"
    pageRef = "/tags"
    weight = 30

# Kit assets come straight from the workspace package — no copying.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "../ui-kit/js"
    target = "assets/js/kit"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../ui-kit/fonts"
    target = "static/fonts"
